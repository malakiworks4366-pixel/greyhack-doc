site_name: Grey Hack Docs
site_description: Unofficial community documentation for Grey Hack — gameplay, GreyScript, and the most popular player-made tools.
site_url: https://malakiworks4366-pixel.github.io/greyhack-doc/
repo_url: https://github.com/malakiworks4366-pixel/greyhack-doc
repo_name: greyhack-doc
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  icon:
    logo: material/console
    repo: fontawesome/brands/github
  favicon: assets/favicon.svg
  font:
    text: Inter
    code: JetBrains Mono
  palette:
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: custom
      accent: custom
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.indexes
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - search.share
    - content.code.copy
    - content.code.annotate
    - content.tabs.link
    - content.action.edit
    - toc.follow

extra_css:
  - assets/extra.css

plugins:
  - search

markdown_extensions:
  - abbr
  - admonition
  - attr_list
  - def_list
  - footnotes
  - md_in_html
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.keys
  - pymdownx.mark
  - pymdownx.tasklist:
      custom_checkbox: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/malakiworks4366-pixel/greyhack-doc
    - icon: fontawesome/brands/steam
      link: https://store.steampowered.com/app/605230/Grey_Hack/

copyright: Unofficial fan documentation. Grey Hack is © Loading Home. Tools belong to their respective authors.

nav:
  - Home: index.md
  - Getting Started:
      - getting-started/index.md
      - What is Grey Hack: getting-started/what-is-grey-hack.md
      - Your First Hour: getting-started/first-hour.md
      - The Desktop & Apps: getting-started/desktop.md
  - Gameplay:
      - gameplay/index.md
      - Networking Basics: gameplay/networking.md
      - Default Ports & Services: gameplay/ports.md
      - Libraries & Exploits: gameplay/exploits.md
